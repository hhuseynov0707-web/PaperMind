<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, Segoe UI, -apple-system, sans-serif">
  <!-- GitHub sosial önizləməsi: Settings → General → Social preview.
       GitHub SVG qəbul etmir, ona görə əvvəlcə PNG-yə çevrilməlidir:
         docs/assets/README.md-də əmr var. -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#09090B"/>
  <circle cx="1080" cy="140" r="420" fill="url(#glow)"/>

  <!-- Brend işarəsi: dalğa kimi yayılan bilik (index.html-dəki brand-mark) -->
  <g transform="translate(96,92) scale(2.6)" fill="none">
    <circle cx="9.5" cy="16" r="3.4" fill="#818CF8"/>
    <path d="M16.5 9.6a8.8 8.8 0 0 1 0 12.8" stroke="#818CF8" stroke-width="2.1"
          stroke-linecap="round" opacity=".72"/>
    <path d="M21.8 5.4a15.2 15.2 0 0 1 0 21.2" stroke="#818CF8" stroke-width="2.1"
          stroke-linecap="round" opacity=".38"/>
  </g>

  <text x="212" y="150" fill="#FAFAFA" font-size="42" font-weight="700"
        letter-spacing="-0.5">PaperMind</text>
  <text x="213" y="182" fill="#818CF8" font-size="16" font-weight="500"
        letter-spacing="2.4">SCIENTIFIC INTELLIGENCE PLATFORM</text>

  <text x="96" y="300" fill="#FAFAFA" font-size="60" font-weight="700"
        letter-spacing="-1.4">Ask in your language,</text>
  <text x="96" y="372" fill="#FAFAFA" font-size="60" font-weight="700"
        letter-spacing="-1.4">find research in English.</text>

  <text x="96" y="430" fill="#A1A1AA" font-size="22">
    Multilingual semantic search over arXiv · Crossref · DOAJ · OpenAlex
  </text>

  <!-- Sübutlu rəqəmlər: mövqe sənədindəki iddialarla eyni olmalıdır -->
  <g font-size="17">
    <rect x="96" y="486" width="228" height="62" rx="12" fill="#18181B" stroke="#27272A"/>
    <text x="116" y="512" fill="#818CF8" font-weight="700">91.4%</text>
    <text x="116" y="534" fill="#A1A1AA">grounded citations</text>

    <rect x="344" y="486" width="228" height="62" rx="12" fill="#18181B" stroke="#27272A"/>
    <text x="364" y="512" fill="#818CF8" font-weight="700">19 fields</text>
    <text x="364" y="534" fill="#A1A1AA">5 discipline groups</text>

    <rect x="592" y="486" width="228" height="62" rx="12" fill="#18181B" stroke="#27272A"/>
    <text x="612" y="512" fill="#818CF8" font-weight="700">AZ · RU · EN</text>
    <text x="612" y="534" fill="#A1A1AA">query and answer</text>

    <rect x="840" y="486" width="228" height="62" rx="12" fill="#18181B" stroke="#27272A"/>
    <text x="860" y="512" fill="#818CF8" font-weight="700">214 tests</text>
    <text x="860" y="534" fill="#A1A1AA">measured, not asserted</text>
  </g>

  <text x="96" y="596" fill="#52525B" font-size="15">
    FastAPI · PostgreSQL/pgvector · Redis · fastembed · Groq · n8n — self-hosted
  </text>
</svg>
